[project]
name = "flet-flip-card"
version = "0.2.0"
description = "FlipCard control for Flet — flips a card between a front and back side."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AyberkA0", email = "ayberkatalaybusiness@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
]

[project.urls]
Homepage = "https://github.com/AyberkA0/flet-flip-card"
Documentation = "https://github.com/AyberkA0/flet-flip-card"
Repository = "https://github.com/AyberkA0/flet-flip-card"
Issues = "https://github.com/AyberkA0/flet-flip-card/issues"

[tool.setuptools.package-data]
"flutter.flet_flip_card" = ["pubspec.yaml", "lib/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
